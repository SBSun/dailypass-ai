[tool.poetry]
name = "ai"
version = "0.1.0"
description = "AI server"
authors = ["SBSun <byung0216@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]  # 소스 코드가 src 폴더에 있을 경우 추가

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
uvicorn = ">=0.34.2,<0.35.0"
pydantic = ">=2.11.3,<3.0.0"
python-dotenv = ">=1.1.0,<2.0.0"
uuid6 = ">=2024.7.10,<2025.0.0"
openai = ">=1.75.0,<2.0.0"
langchain = ">=0.3.23,<0.4.0"
langchain-core = ">=0.3.54,<0.4.0"
langchain-community = ">=0.3.21,<0.4.0"
dependency-injector = "^4.46.0"
psycopg2-binary = "^2.9.10"
langchain-openai = "^0.3.14"
pypdf = "^5.9.0"
python-multipart = "^0.0.20"
grpcio = "^1.74.0"
grpcio-tools = "^1.74.0"
protobuf = "^6.31.1"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.2.0,<5.0.0"
mypy = ">=1.15.0,<2.0.0"
ruff = "^0.3.0"
grpcio-tools = "^1.74.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "B", "C4"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = true
strict = true
ignore_missing_imports = true
disable_error_code = ["misc"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["fastapi.*"]
implicit_reexport = true
